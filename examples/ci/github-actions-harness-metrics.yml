# Optional adapter; review/pin action versions and retain artifacts under project policy.
name: Harness Metrics

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  record:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record observable harness metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          python3 << 'PY'
          import json, os, pathlib, re, subprocess

          pr_number = int(os.environ["PR_NUMBER"])
          body = os.environ.get("PR_BODY") or ""
          date = os.environ["PR_MERGED_AT"][:10]
          diff = subprocess.run(
              ["gh", "pr", "diff", str(pr_number), "--name-only"],
              capture_output=True,
              text=True,
              check=True,
          )
          files = [line for line in diff.stdout.splitlines() if line]

          layers = []
          if any(f.startswith("src/") or f.startswith("app/") for f in files):
              layers.append("app")
          if any(f.startswith("infra/") for f in files):
              layers.append("infra")
          if any(f.startswith("harness/") or f.startswith(".harness/") for f in files):
              layers.append("harness")
          if any(f.startswith("specs/") for f in files):
              layers.append("specs")

          record = {
              "schema_version": "1.0",
              "date": date,
              "timestamp": os.environ["PR_MERGED_AT"],
              "pr_number": pr_number,
              "layers": layers,
              "has_attention_packet": bool(re.search(r"##\s*PR Attention Packet", body, re.I)),
              "has_qa_packet": bool(re.search(r"##\s*QA Impact Packet", body, re.I)),
              "has_feedback_event": any(".harness/reviews/" in f for f in files),
          }

          out_dir = pathlib.Path(".harness/run-metrics")
          out_dir.mkdir(parents=True, exist_ok=True)
          with (out_dir / "current-run.jsonl").open("w") as fh:
              fh.write(json.dumps(record) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: harness-run-metrics
          path: .harness/run-metrics/current-run.jsonl
          include-hidden-files: true
          retention-days: 7
